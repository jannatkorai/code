<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4e73df, #1cc88a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #fff;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            padding: 20px;
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: -60px;
            border: 5px solid white;
        }

        .card h2 {
            margin: 15px 0 5px;
        }

        .card p {
            color: gray;
            font-size: 14px;
        }

        .card button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background-color: #4e73df;
            color: white;
            border-radius: 25px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #2e59d9;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="assert/heer.jpeg" alt="Profile">
        <h2>Jannat Korai</h2>
        <p>Web Developer & Designer</p>
        <button>Follow</button>
    </div>

</body>
</html>
